server {
    listen 80;
    listen [::]:80;
    server_name camp.example.com;

    location /static/ {
        alias /srv/typecamp/staticfiles/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8100;
    }
}
